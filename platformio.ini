[platformio]
default_envs = esp32dev, esp32-c3-super-mini, esp32-s2-mini

[env_base]
platform = espressif32
framework = arduino
monitor_speed = 115200
lib_deps =
  knolleary/PubSubClient@^2.8
  bblanchon/ArduinoJson@^7.0.0
build_flags = -D CORE_DEBUG_LEVEL=0

[env:esp32dev]
extends = env_base
board = esp32dev
build_flags = ${env_base.build_flags}
  -D RADIO_PIN_SCK=18 -D RADIO_PIN_MISO=19 -D RADIO_PIN_MOSI=23
  -D RADIO_PIN_NSS=5 -D RADIO_PIN_RESET=27 -D RADIO_PIN_DIO0=26

[env:esp32-c3-super-mini]
extends = env_base
board = esp32-c3-devkitm-1
build_flags = ${env_base.build_flags}
  -D ARDUINO_USB_MODE=1 -D ARDUINO_USB_CDC_ON_BOOT=1
  -D RADIO_PIN_SCK=4 -D RADIO_PIN_MISO=5 -D RADIO_PIN_MOSI=6
  -D RADIO_PIN_NSS=7 -D RADIO_PIN_RESET=2 -D RADIO_PIN_DIO0=3

[env:esp32-s2-mini]
extends = env_base
board = lolin_s2_mini
build_flags = ${env_base.build_flags}
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D RADIO_PIN_SCK=12 -D RADIO_PIN_MISO=13 -D RADIO_PIN_MOSI=11
  -D RADIO_PIN_NSS=10 -D RADIO_PIN_RESET=9 -D RADIO_PIN_DIO0=8
